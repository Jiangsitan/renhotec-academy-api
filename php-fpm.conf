; PHP-FPM Pool Configuration for Renhotec Academy
; Overrides default www.conf with higher worker limits

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 25
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
pm.max_requests = 500

request_terminate_timeout = 300s
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2
