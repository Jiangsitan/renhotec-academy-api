services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: renhotec-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-renhotec123}
      MYSQL_DATABASE: renhotec_academy
      MYSQL_USER: ${DB_USERNAME:-renhotec}
      MYSQL_PASSWORD: ${DB_PASSWORD:-renhotec123}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: renhotec-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Laravel API 服务
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: renhotec-api
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-http://localhost:9000}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=renhotec_academy
      - DB_USERNAME=${DB_USERNAME:-renhotec}
      - DB_PASSWORD=${DB_PASSWORD:-renhotec123}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - storage_data:/app/storage
      - ./public/storage:/app/public/storage

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: renhotec-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-9000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  mysql_data:
  redis_data:
  storage_data:
