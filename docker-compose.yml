services:
  mysql:
    image: mysql:8.0
    container_name: renhotec-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-renhotec123}
      MYSQL_DATABASE: renhotec_academy
      MYSQL_USER: ${DB_USERNAME:-renhotec}
      MYSQL_PASSWORD: ${DB_PASSWORD:-renhotec123}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: renhotec-redis
    restart: unless-stopped
    ports:
      - "6479:6479"
    volumes:
      - redis_data:/data
    command: redis-server --port 6479 --appendonly yes --requirepass ${REDIS_PASSWORD:-Rh_2026}

  api:
    image: academy-api:v1
    container_name: renhotec-api
    restart: unless-stopped
    ports:
      - "9000:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-https://learn.renhotec.cn}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=renhotec_academy
      - DB_USERNAME=${DB_USERNAME:-renhotec}
      - DB_PASSWORD=${DB_PASSWORD:-renhotec123}
      - REDIS_HOST=redis
      - REDIS_PORT=6479
      - REDIS_PASSWORD=${REDIS_PASSWORD:-Rh_2026}
      - SSO_CENTER_URL=${SSO_CENTER_URL:-https://home.renhotec.cn}
      - SSO_CLIENT_ID=${SSO_CLIENT_ID:-Academy_001}
      - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - storage_data:/app/storage
      - ./public/storage:/app/public/storage
      - ./scripts:/app/scripts
      - /tmp:/tmp

  queue:
    image: academy-api:v1
    container_name: renhotec-queue
    restart: always
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-https://learn.renhotec.cn}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=renhotec_academy
      - DB_USERNAME=${DB_USERNAME:-renhotec}
      - DB_PASSWORD=${DB_PASSWORD:-renhotec123}
      - REDIS_HOST=redis
      - REDIS_PORT=6479
      - REDIS_PASSWORD=${REDIS_PASSWORD:-Rh_2026}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - storage_data:/app/storage
      - ./public/storage:/app/public/storage
      - ./scripts:/app/scripts
      - /tmp:/tmp

  web:
    image: academy-nuxt:v1
    container_name: renhotec-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE=/api
      - NUXT_PUBLIC_SSO_URL=${NUXT_PUBLIC_SSO_URL:-https://home.renhotec.cn}
      - NUXT_PUBLIC_SSO_CLIENT_ID=${NUXT_PUBLIC_SSO_CLIENT_ID:-Academy_001}

volumes:
  mysql_data:
  redis_data:
  storage_data: